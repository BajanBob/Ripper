name: Build executables

# Builds Windows, macOS and Linux apps.
# - Every push to main / manual run: downloadable from the run's "Artifacts".
# - Pushing a tag like v1.0.0: also attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build desktop app and command-line tool
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name VideoDownloader \
            --collect-all imageio_ffmpeg --collect-all py7zr gui.py
          pyinstaller --noconfirm --onefile --name vdl \
            --collect-all imageio_ffmpeg --collect-all py7zr cli.py

      - name: Package
        shell: bash
        run: |
          cp README.md LICENSE dist/
          cd dist
          rm -rf *.spec
          if [ "${{ matrix.target }}" = "windows" ]; then
            7z a ../VideoDownloader-windows.zip .
          else
            zip -r -y ../VideoDownloader-${{ matrix.target }}.zip .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-${{ matrix.target }}
          path: VideoDownloader-${{ matrix.target }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoDownloader-${{ matrix.target }}.zip
